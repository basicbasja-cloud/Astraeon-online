<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>16-frame pickup contact repair</title><style>body{background:#20252d;color:#eee;font:16px system-ui;margin:24px}canvas{background:#292b30;max-width:100%;height:auto}button,select,input{font:inherit;margin:6px}p{max-width:1000px;line-height:1.5}.warn{color:#ffc96a}</style><h1>ท่าก้ม 16 เฟรม · แก้ตำแหน่งวางภาพ</h1><p class="warn">ตรวจตำแหน่งพื้นเท้า · 16 เฟรม / 1.9 วินาที</p><p>ซ้าย: ชุด16เดิม · ขวา: แก้ตำแหน่งร่วมต่อแถว และใช้ท่าคั่นชุดเดียวกันทั้ง8ภาพ · คีย์หลัก8ภาพเดิม</p><canvas id="view" width="768" height="512"></canvas><p><button id="play">เล่น</button><button id="prev">ก่อนหน้า</button><button id="next">ถัดไป</button><input id="frame" type="range" min="0" max="15" value="0"><select id="speed"><option value="1">1×</option><option value="0.25">0.25×</option></select><label><input id="loop" type="checkbox">วนดู</label><label><input id="grid" type="checkbox" checked>กริด32px</label></p><p id="status"></p><script src="inputs/sprite-clip-clock.cjs"></script><script>

function draw(){if(!ready)return;ctx.clearRect(0,0,768,512);renderSingle(ox,k,false);ctx.drawImage(off,0,0);renderSingle(ox,k,true);ctx.drawImage(off,384,0);if($('grid').checked){ctx.strokeStyle='#ffffff2a';ctx.beginPath();for(let x=0;x<=768;x+=32){ctx.moveTo(x,0);ctx.lineTo(x,512)}for(let y=0;y<=512;y+=32){ctx.moveTo(0,y);ctx.lineTo(768,y)}ctx.stroke()}$('frame').value=k;$('status').textContent=`เฟรม${k+1}/16 · ${DATA.clock_ms[k]}ms · ${DATA.mapping[k][0]==='old'?'คีย์เดิม':'ท่าคั่น'}`;$('play').textContent=playing?'หยุด':'เล่น'}

<!doctype html><html lang="th"><meta charset="utf-8"><title>Same-frame head ownership study</title>
<style>body{font:16px system-ui;background:#252d37;color:#eee;margin:20px}button,label,select{margin:8px;font:inherit}canvas{display:block;max-width:95vw;max-height:76vh;border:1px solid #789}p{max-width:1000px}</style>
<h1>ไดคัทจากเฟรมเดียวกัน · ชุดตรวจ 120 เฟรม</h1>
<p>BodyRest ยังรวมอาวุธอยู่ ไม่ใช่ BodyCostume ที่แยกครบ ภาพ Mage ยังมี anatomy/ขนาดไม่ต่อเนื่อง ชุดนี้ใช้ตรวจการประกอบและขอบภาพ ยังไม่ผ่านเข้าชุดเล่นจริง</p>
<select id="group"></select><button id="play">เล่นหนึ่งครั้ง</button><label>เฟรม <input id="frame" type="range" min="0" max="15" value="0"><output id="number">0</output></label>
<label><input id="slow" type="checkbox">ช้า ×3</label><label>พื้นหลัง <input id="background" type="color" value="#dddddd"></label>
<label><input id="body" type="checkbox" checked> BodyRest</label><label><input id="head" type="checkbox" checked> HeadHair</label>
<canvas id="stage" width="512" height="512"></canvas><p id="status">กำลังโหลด…</p>
<script src="../../../../modular-sprites.js"></script><script>
const stage=document.querySelector('#stage'),ctx=stage.getContext('2d'),slider=document.querySelector('#frame'),select=document.querySelector('#group');let rows=[],group=[],frame=0,playing=false,start=0;const images={},masters={};
function sample(row){const n=row.size;return{canvas:{frameWidth:n,frameHeight:n,compositionWidth:n,compositionHeight:n,rootAnchorX:n/2,rootAnchorY:n*.875},sockets:{root:[n/2,n*.875]},layers:['BodyRest','HeadHair'].map(role=>({atlasId:row.id+'/'+role,rect:[0,0,n,n],offset:[0,0]}))}}
function draw(c,row,roles=['BodyRest','HeadHair']){const s=sample(row);s.layers=s.layers.filter(l=>roles.includes(l.atlasId.split('/').at(-1)));AstraeonModularSprites.draw(c,s,images,{x:row.size/2,y:row.size*.875,scale:1})}
function render(i){frame=i;slider.value=i;document.querySelector('#number').value=i;const row=group[i];if(!row)return;if(stage.width!==row.size){stage.width=stage.height=row.size}ctx.fillStyle=document.querySelector('#background').value;ctx.fillRect(0,0,row.size,row.size);draw(ctx,row,[...(document.querySelector('#body').checked?['BodyRest']:[]),...(document.querySelector('#head').checked?['HeadHair']:[])])}
function choose(){playing=false;group=rows.filter(r=>r.group===select.value);slider.max=group.length-1;render(0)}
function load(url,target,key){return new Promise((resolve,reject)=>{const im=new Image;im.onload=()=>{target[key]=im;resolve()};im.onerror=()=>reject(Error(url));im.src='../../../../'+url})}
function verify(){const records=[];for(const row of rows){const a=document.createElement('canvas'),e=document.createElement('canvas');a.width=a.height=e.width=e.height=row.size;const ac=a.getContext('2d',{willReadFrequently:true}),ec=e.getContext('2d',{willReadFrequently:true});draw(ac,row);ec.drawImage(masters[row.id],0,0);const x=ac.getImageData(0,0,row.size,row.size).data,y=ec.getImageData(0,0,row.size,row.size).data;let mismatches=0;for(let p=0;p<x.length;p+=4)if(x[p]!==y[p]||x[p+1]!==y[p+1]||x[p+2]!==y[p+2]||x[p+3]!==y[p+3])mismatches++;records.push({id:row.id,mismatchPixels:mismatches});a.width=e.width=1}return{status:records.every(r=>r.mismatchPixels===0)?'COMPOSITOR_PASS_NOT_ART_APPROVAL':'FAIL',frames:records.length,records,actualGameplayCapture:false,runtimeAdmitted:false,perFrameFit:false}}
fetch('browser-frames.json').then(r=>r.json()).then(async data=>{rows=data;for(const g of new Set(rows.map(r=>r.group))){const opt=document.createElement('option');opt.value=opt.textContent=g;select.append(opt)}await Promise.all(rows.flatMap(r=>[load(r.source,masters,r.id),...Object.entries(r.parts).map(([role,path])=>load(path,images,r.id+'/'+role))]));window.factoryAudit=verify();window.ownershipStudy={render,choose,rows};document.querySelector('#status').textContent=window.factoryAudit.status+' · '+rows.length+' เฟรม · ไม่ใช่การรับรองภาพหรือ gameplay';choose()}).catch(e=>{window.factoryAudit={status:'FAIL',error:String(e)};document.querySelector('#status').textContent=String(e)});
slider.oninput=()=>{playing=false;render(Number(slider.value))};select.onchange=choose;for(const id of ['background','body','head'])document.querySelector('#'+id).oninput=()=>render(frame);document.querySelector('#play').onclick=()=>{playing=true;start=performance.now();render(0)};
function tick(now){if(playing){const step=(group[0].group.startsWith('mage')?1000/24:80)*(document.querySelector('#slow').checked?3:1);render(Math.min(group.length-1,Math.floor((now-start)/step)));if(now-start>=group.length*step)playing=false}requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>

<!doctype html><meta charset="utf-8"><title>Native cutout composition regression</title><link rel="icon" href="data:,">
<style>body{font:15px system-ui;background:#ddd;color:#222;margin:24px}section{display:inline-block;vertical-align:top;margin:12px}canvas{background:repeating-conic-gradient(#ccc 0 25%,#eee 0 50%) 0/16px 16px;border:1px solid #888}pre{white-space:pre-wrap}h2{font-size:16px}</style>
<h1>Source composition regression</h1><p>Technical pixel checks. Colored fixtures test hidden surfaces. The Archer images test an actual head/body seam; the weapon is still fused in the body. This is not gameplay or six-character acceptance.</p><div id="views"></div><pre id="report">Running…</pre><script src="../../../../modular-sprites.js?v=106"></script><script>
(async()=>{
const api=window.AstraeonModularSprites,checks=[],views=document.querySelector('#views');
function canvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function display(c,title){const section=document.createElement('section'),h=document.createElement('h2');h.textContent=title;section.append(h,c);views.append(section)}
function pixels(c){return c.getContext('2d').getImageData(0,0,c.width,c.height).data}
function difference(a,b){const x=pixels(a),y=pixels(b);let count=0;for(let i=0;i<x.length;i+=4)if(x[i]!==y[i]||x[i+1]!==y[i+1]||x[i+2]!==y[i+2]||x[i+3]!==y[i+3])count++;return count}
function reference(sample,images,alpha=1){const c=sample.canvas,src=canvas(c.compositionWidth,c.compositionHeight),s=src.getContext('2d');for(const ref of sample.layers){const [x,y]=ref.offset||[0,0];s.drawImage(images[ref.atlasId],...ref.rect,x,y,ref.rect[2],ref.rect[3])}const out=canvas(c.frameWidth,c.frameHeight),ctx=out.getContext('2d');ctx.globalAlpha=alpha;ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(src,0,0,src.width,src.height,0,0,out.width,out.height);return out}
function render(sample,images,alpha=1){const c=sample.canvas,out=canvas(c.frameWidth,c.frameHeight),ctx=out.getContext('2d');ctx.globalAlpha=alpha;api.draw(ctx,sample,images,{x:c.rootAnchorX,y:c.rootAnchorY});return out}
function check(name,sample,images,alpha=1){const actual=render(sample,images,alpha),expected=reference(sample,images,alpha),changed=difference(actual,expected);checks.push({name,changed_pixels:changed,passed:changed===0});return actual}
const body=canvas(128,128),head=canvas(128,128),weapon=canvas(128,128),hairAlt=canvas(128,128);body.getContext('2d').fillStyle='#38683e';body.getContext('2d').fillRect(24,24,80,98);let ctx=head.getContext('2d');ctx.fillStyle='#ba874c';ctx.beginPath();ctx.ellipse(61.5,27.5,25.5,24,0,0,Math.PI*2);ctx.fill();ctx=weapon.getContext('2d');ctx.strokeStyle='#ccdbea';ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(47,103);ctx.lineTo(79,19);ctx.stroke();ctx=hairAlt.getContext('2d');ctx.fillStyle='#ddd7f2';ctx.beginPath();ctx.ellipse(60.5,29.5,21,20,0,0,Math.PI*2);ctx.fill();
const images={body,head,weapon,hairAlt},sample={canvas:{frameWidth:40,frameHeight:40,compositionWidth:128,compositionHeight:128,rootAnchorX:20,rootAnchorY:32},sockets:{root:[20,32]},layers:['body','head','weapon'].map(atlasId=>({atlasId,rect:[0,0,128,128],offset:[0,0]}))};
display(check('overlapping_hidden_body_retained',sample,images),'Hidden underlay fixture');const noWeapon={...sample,layers:sample.layers.filter(r=>r.atlasId!=='weapon')};display(check('weapon_removal_reveals_body',noWeapon,images),'Weapon removed');check('hairstyle_swap_reveals_body',{...sample,layers:sample.layers.map(r=>r.atlasId==='head'?{...r,atlasId:'hairAlt'}:r)},images);check('whole_character_opacity',sample,images,.5);
const trimmedImages={},trimmedLayers=[];for(const [id,box]of Object.entries({body:[24,24,80,98],head:[34,1,56,54],weapon:[39,10,49,100]})){const [x,y,w,h]=box,im=canvas(w,h);im.getContext('2d').drawImage(images[id],x,y,w,h,0,0,w,h);trimmedImages[id]=im;trimmedLayers.push({atlasId:id,rect:[0,0,w,h],offset:[x,y]})}const trimmed={...sample,layers:trimmedLayers};check('trimmed_source_offsets_preserve_pixels',trimmed,trimmedImages);check('trimmed_source_opacity',trimmed,trimmedImages,.5);
const actualImages={};await Promise.all(['BodyCostume','HeadHair','Weapon'].map(async role=>{const im=new Image();im.src=role+'.png';await im.decode();actualImages[role]=im}));const actual={canvas:{frameWidth:240,frameHeight:240,compositionWidth:768,compositionHeight:768,rootAnchorX:120,rootAnchorY:172},sockets:{root:[120,172]},layers:['BodyCostume','HeadHair','Weapon'].map(atlasId=>({atlasId,rect:[0,0,768,768],offset:[0,0]}))};const corrected=check('actual_archer_head_body_seam',actual,actualImages);display(corrected,'Actual cutouts: compose, then reduce');const legacy={...actual,canvas:{...actual.canvas}};delete legacy.canvas.compositionWidth;delete legacy.canvas.compositionHeight;const independent=render(legacy,actualImages);display(independent,'Independent layer reduction baseline');const baselineChanged=difference(corrected,independent);
const unchanged=canvas(240,240),uc=unchanged.getContext('2d');uc.fillStyle='#9c3467';uc.fillRect(0,0,240,240);const before=Array.from(pixels(unchanged));let rejected=false;try{api.draw(uc,actual,{BodyCostume:actualImages.BodyCostume})}catch(e){rejected=/Atlas not loaded/.test(e.message)}const after=pixels(unchanged),untouched=before.every((v,i)=>v===after[i]);checks.push({name:'missing_atlas_is_atomic',passed:rejected&&untouched});
window.nativeCompositionReport={status:checks.every(c=>c.passed)&&baselineChanged>0?'TECHNICAL_PIXEL_PASS_NOT_ART_OR_GAMEPLAY_ACCEPTANCE':'FAIL',checks,independent_layer_changed_pixels:baselineChanged,new_playable_characters_verified:0};document.querySelector('#report').textContent=JSON.stringify(window.nativeCompositionReport,null,2);
})().catch(e=>{window.nativeCompositionReport={status:'FAIL',error:String(e)};document.querySelector('#report').textContent=String(e)});
</script>

<!doctype html><html lang="en"><meta charset="utf-8"><title>Wayfarer authored building families</title>
<style>body{margin:0;background:#14232b;color:#f0e2c5;font:16px system-ui;padding:24px}h1{margin:0 0 8px;font:28px Georgia}p{color:#bac8bc;margin:0 0 20px}.sheet{display:grid;grid-template-columns:repeat(4,400px);gap:16px}.card{background:#23363c;border:1px solid #788474;border-radius:8px;overflow:hidden}.card img{display:block;width:400px;height:300px}.card h2{margin:12px 16px 4px;font:20px Georgia}.card p{font-size:13px;margin:0 16px 16px}.host{position:fixed;width:400px;height:300px;left:0;top:0;opacity:0;pointer-events:none}.host canvas{width:400px;height:300px}#status{font-size:13px}</style>
<h1>Wayfarer — authored architecture and variants</h1><p>Actual exported Blender meshes, UVs and runtime materials. Fixed gameplay camera; each structure retains its source transform and ID.</p><div class="sheet"></div><p id="status">Rendering native families…</p><div class="host"><canvas></canvas></div>
<script src="../world-view.js"></script><script src="../navigation.js"></script><script src="../world/v3/spatial.js"></script>
<script type="module">
import '../world/v3/renderer.js';
const data=await fetch('../world/v3/wayfarer-spatial.json').then(r=>r.json());
const entries=[['guild-hall','Consortium Hall','Civic · blue spires, astronomical portal, stone terrace'],['moon-shrine','Luna Shrine','Sacred · bell tower, ceremonial approach, quiet garden'],['east-inn',"The Seafarer’s Rest",'Social · balcony, covered porch, traveler frontage'],['artisan-workshop','Bronze Anvil','Workshop · chimney, open shelter, hearth, anvil and stock'],['market-shop','Merchant frontage','Market · broad warm frontage and ochre awning'],['east-house','Eastern merchant','Market · blue awning and distinct footprint'],['food-market','Public stall','Market · open canopy, timber counter and goods'],['market-textiles','Textile stall','Market · rose cloth, scalloped canopy, folded goods'],['market-spices','Spice stall','Market · broad ochre canopy, goods and barrel'],['market-supplies','Travel supplies','Market · narrow blue canopy and provision packs'],['caravan-gate','West Gate','Fortification · solid towers, blue caps, open passage and bridge'],['residence','Domestic townhouse','Residential · tall gable, dormer and window boxes'],['willow-house','Garden house','Residential · teal hip roof and garden pickets'],['north-house','Hearth cottage','Residential · low clay roof, chimney and dormer'],['west-house','Eastern residence','Residential · wider lot and domestic frontage'],['northwest-cottage','Northern cottage','Residential · compact crosswise clay ridge and garden beds'],['north-garden-house','Northern narrow house','Residential · two storeys, deep lot, blue ridge and angled entry']];
for(const [id,title,description] of entries){
 const object=data.objects.find(o=>o.id===id);if(!object)throw Error('Missing family '+id);
 const displayParts=object.parts.filter(p=>!p.id.startsWith('field-shore-')),vertices=displayParts.flatMap(p=>p.vertices),projected=vertices.map(([x,y,z])=>{const p=AstraeonView.project(x,y);return [p.x,p.y-z*35]});
 const xs=projected.map(p=>p[0]),ys=projected.map(p=>p[1]),minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
 const bounds={minX:Math.min(...vertices.map(v=>v[0]))-1,maxX:Math.max(...vertices.map(v=>v[0]))+1,minY:Math.min(...vertices.map(v=>v[1]))-1,maxY:Math.max(...vertices.map(v=>v[1]))+1};
 const terrain={bounds,elevation:0,material:'grass',surfaces:[],vertices:[[bounds.minX,bounds.minY,0],[bounds.maxX,bounds.minY,0],[bounds.maxX,bounds.maxY,0],[bounds.minX,bounds.maxY,0]],faces:[[0,1,2,3]]};
 const source={...data,terrain,objects:[{...object,parts:displayParts}]},view=new AstraeonSpatialRenderer.SpatialRenderer(source);await view.whenReady;
 view.mount(document.querySelector('.host canvas'));view.renderer.setPixelRatio(1.5);view.begin({x:(minX+maxX)/2,y:(minY+maxY)/2},400,300,Math.min(360/(maxX-minX),250/(maxY-minY),1.25),.5);view.end();
 const image=document.createElement('img');image.src=view.canvas.toDataURL();image.alt=title;await image.decode();
 const card=document.createElement('article');card.className='card';const heading=document.createElement('h2');heading.textContent=title;const text=document.createElement('p');text.textContent=description+' · '+id;card.append(image,heading,text);document.querySelector('.sheet').append(card);
 view.renderer.dispose();view.renderer.forceContextLoss();view.canvas.remove();
}
document.querySelector('#status').textContent='Complete · '+entries.length+' authored structures. Art acceptance requires district and gameplay review.';window.familySheetReady=true;
</script></html>

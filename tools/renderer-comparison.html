<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASTRAEON renderer comparison</title>
<style>body{margin:0;background:#25372d;color:#efe1be;font:14px system-ui}canvas{position:absolute;inset:0;width:100%;height:100%;background:transparent}header{position:absolute;z-index:2;left:12px;top:12px;background:#13252ae8;padding:12px}button,a{margin:4px;color:#f1dfad}button{background:#294439;border:1px solid #7b8763;padding:8px}pre{margin:8px}</style>
<canvas id="compare"></canvas><header>Same saved Blender scene · same navigation · same illustrated Warrior<br><a href="?backend=canvas">Canvas2D</a><a href="?backend=webgl">Three.js / shared depth</a><div id="routes"></div><pre id="status">Loading…</pre></header>
<script src="../world-view.js"></script><script src="../navigation.js"></script><script src="../character-motion.js"></script><script src="../directional-metadata.js"></script><script src="../hero-registration.js"></script><script src="../warrior-gait.js"></script><script src="../warrior-rig.js"></script><script src="../world/v3/locomotion.js"></script><script src="../world/v3/warrior-registration.js"></script><script src="../world/v3/spatial.js"></script><script src="../world/v3/canvas-world.js"></script>
<script type="module">
import '../world/v3/renderer.js';
const [data,manifest]=await Promise.all(['golden-proof','warrior-animation'].map(x=>fetch('../world/v3/'+x+'.json').then(r=>r.json())));
// Resolve existing art paths relative to this engineering harness.
for(const c of Object.values(manifest.clips))c.atlas='../'+c.atlas;
const ImageOriginal=window.Image;window.Image=class extends ImageOriginal{set src(v){super.src=v.startsWith('assets/')?'../'+v:v}get src(){return super.src}};
AstraeonLocomotionV3.configure(manifest);const world=AstraeonSpatialV3.compile(data),warrior=new AstraeonCanvasV3.WarriorView(manifest);await warrior.load();
const canvas=document.querySelector('#compare'),backend=new URLSearchParams(location.search).get('backend')||'webgl',view=backend==='canvas'?new AstraeonCanvasV3.WorldView(canvas,world):new AstraeonSpatialRenderer.SpatialRenderer(data);if(backend==='webgl')view.mount(canvas);
const actor=new AstraeonLocomotionV3.Locomotion(...data.spawn),keys=new Set(),frames=[],costs=[];let route=[],last=performance.now(),time=0,camera={x:0,y:0};
for(const s of data.route){const b=document.createElement('button');b.textContent=s.name;b.onclick=()=>route=world.route(actor.position,{x:s.position[0],y:s.position[1]})||[];document.querySelector('#routes').append(b)}
addEventListener('keydown',e=>keys.add(e.key));addEventListener('keyup',e=>keys.delete(e.key));
function layout(){const b=world.bounds,w=innerWidth,h=innerHeight,zoom=w<700?1:Math.min(1.05,(w-60)/((b.maxX-b.minX)*48+(b.maxY-b.minY)*32),(h-175)/((b.maxX-b.minX)*14+(b.maxY-b.minY)*22+26)),p=w<700?actor.position:{x:(b.minX+b.maxX)/2,y:(b.minY+b.maxY)/2};return{w,h,zoom,center:AstraeonView.project(p.x,p.y)}}
canvas.onpointerdown=e=>{const l=layout(),p=backend==='canvas'?view.screenToWorld(e.clientX,e.clientY):AstraeonView.inverse((e.clientX-l.w/2)/l.zoom+camera.x,(e.clientY-l.h*.57)/l.zoom+camera.y);route=world.route(actor.position,p)||[]};
function loop(stamp){const ms=stamp-last;last=stamp;const dt=Math.min(.035,ms/1000);time+=dt;let dir=null;const x=(keys.has('d')?1:0)-(keys.has('a')?1:0),y=(keys.has('s')?1:0)-(keys.has('w')?1:0);if(x||y){route=[];dir=AstraeonMotion.cameraMovement(x,y,AstraeonView.inverse)}else if(route.length){const p=route[0],dx=p.x-actor.position.x,dy=p.y-actor.position.y,n=Math.hypot(dx,dy);if(n<.08)route.shift();else dir={x:dx/n,y:dy/n,magnitude:Math.min(1,n/(actor.profile.speed*dt))}}
actor.setStrategy(keys.has('Shift')?'sprint':'run');let nx=actor.position.x,ny=actor.position.y;if(dir){const speed=actor.profile.speed;nx+=dir.x*speed*dt*(dir.magnitude||1);ny+=dir.y*speed*dt*(dir.magnitude||1);if(world.blocked(nx,ny)){nx=actor.position.x;ny=actor.position.y}}
actor.tick(nx,ny,dt,{sprint:keys.has('Shift'),elevation:world.elevationAt(nx,ny)});const started=performance.now();
if(backend==='canvas')view.update(actor,warrior.draw(actor),dt);else{const l=layout(),k=1-Math.exp(-6*dt);camera.x+=(l.center.x-camera.x)*k;camera.y+=(l.center.y-camera.y)*k;AstraeonView.zoom=l.zoom;view.begin(camera,l.w,l.h,l.zoom,.57);view.actor('warrior',actor,(g)=>{const bitmap=warrior.draw(actor);g.drawImage(bitmap,64,122)});view.end()}
if(time>1){frames.push(ms);costs.push(performance.now()-started);if(frames.length>300){frames.shift();costs.shift()}}
document.querySelector('#status').textContent=backend+' · '+actor.state+' · '+Math.round(1000/(frames.reduce((a,b)=>a+b,0)/frames.length))+' fps';requestAnimationFrame(loop)}requestAnimationFrame(loop);
window.RendererComparison=Object.freeze({snapshot:()=>({backend,source:data.source,position:{...actor.position},route:[...route],frames:[...frames],costs:[...costs],view:view.snapshot()}),screen:(x,y)=>{const l=layout(),p=AstraeonView.project(x,y);return backend==='canvas'?view.worldToScreen(x,y):{x:l.w/2+(p.x-camera.x)*l.zoom,y:l.h*.57+(p.y-camera.y)*l.zoom}}});
</script></html>

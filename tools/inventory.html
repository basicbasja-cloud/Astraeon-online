<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<title>ASTRAEON item developer harness</title>
<h1>Item / inventory / equipment sandbox</h1>
<p>Developer only. Separate save key: <code>astraeon-inventory-dev-v1</code>.</p>
<p id="status" role="status"></p>
<p><label>Definition <select id="definition"></select></label> <label>Amount <input id="amount" type="number" value="1"></label>
<button id="add-stack">Add stack</button> <button id="remove-stack">Remove stack</button> <button id="create-instance">Create instance</button></p>
<p><label>Instance <select id="instance"></select></label> <label>Equipment slot <select id="slot"><option>weapon</option><option>armor</option><option>relic</option></select></label>
<button id="delete-instance">Delete unequipped instance</button> <button id="equip">Equip</button> <button id="unequip">Unequip</button></p>
<p><button id="save">Save</button> <button id="reload">Reload</button></p>
<p><label>Historical/current migration fixture<br><textarea id="migration-input" rows="7" cols="100">{"saveVersion":4,"name":"Migration fixture","inventory":{"herb":3,"blade":1},"equipment":{"weapon":"Astral Blade","armor":"Adventurer Garb","relic":"None"}}</textarea></label>
<button id="inspect-migration">Inspect migration (does not replace inventory)</button></p>
<pre id="migration-result"></pre>
<h2>Definitions (provisional existing content)</h2><pre id="definitions"></pre>
<h2>Stacks / instances / next serial</h2><pre id="inventory"></pre>
<h2>Equipment / compiled modifiers / carried weight</h2><pre id="equipment"></pre>
<h2>Derived Stats</h2><pre id="derived"></pre>
<h2>Persistent snapshot</h2><pre id="persistent"></pre>

<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASTRAEON responsive QA</title><style>body{margin:0;background:#080e15;color:#f2dfbb;font:14px system-ui}header{display:flex;gap:10px;align-items:center;padding:12px;flex-wrap:wrap}button{padding:9px 14px;background:#233746;color:#f2dfbb;border:1px solid #657c82;border-radius:6px}button[aria-pressed=true]{background:#715b35}main{display:grid;place-items:center;overflow:auto;padding:12px}iframe{border:1px solid #536d71;flex-shrink:0;background:#0c1420}p{margin:0;color:#a7babb}output{display:block;padding:0 12px 8px;color:#a7d8c5}</style><header><strong>ASTRAEON · Responsive QA</strong><button data-size="1280,720" aria-pressed="true">Desktop 1280 × 720</button><button data-size="390,844" aria-pressed="false">Portrait 390 × 844</button><button data-size="844,390" aria-pressed="false">Landscape 844 × 390</button><button data-size="768,1024" aria-pressed="false">Tablet 768 × 1024</button><p>Changing size resizes the same live game; it does not reload its world.</p></header><output id="metrics">Waiting for runtime sample…</output><main><iframe id="preview" title="Live responsive game" width="1280" height="720" src="./index.html?build=27&amp;qa=1"></iframe></main><script>document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{const [w,h]=b.dataset.size.split(',');const f=document.getElementById('preview');f.width=w;f.height=h;document.querySelectorAll('[data-size]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==document.getElementById('preview').contentWindow||e.data.type!=='astraeon-qa')return;const d=e.data;document.getElementById('metrics').textContent=`${d.fps} FPS · p95 ${d.p95} ms · player (${d.x}, ${d.y}) · HP ${d.hp} · zone ${d.zone} · ${d.state} · ${d.actors} foes · ${d.projectiles} projectiles`})</script></html>
